name: Refresh and publish hardware jobs

on:
  schedule:
    # Frequent checkpoints absorb GitHub scheduler delays; the cadence gate below
    # still limits full source scans to roughly once per hour.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-and-publish.yml"
      - "config/**"
      - "lib/**"
      - "site/**"
      - "tests/**"
      - "generate_public_site.ps1"
      - "monitor.ps1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: public-hardware-job-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out monitor state
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Synchronize latest cloud state
        shell: bash
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Decide whether a cloud scan is due
        id: cadence
        shell: pwsh
        run: |
          $scanDue = $true
          $reason = 'Manual or source-change refresh'
          if ('${{ github.event_name }}' -eq 'schedule') {
            $reason = 'No valid prior cloud scan timestamp'
            $health = Get-Content -LiteralPath './health/status.json' -Raw | ConvertFrom-Json
            $lastScan = [DateTimeOffset]::MinValue
            if ([DateTimeOffset]::TryParse([string]$health.LastSuccessfulScanUtc, [ref]$lastScan)) {
              $ageMinutes = ([DateTimeOffset]::UtcNow - $lastScan.ToUniversalTime()).TotalMinutes
              if ($ageMinutes -lt 50) {
                $scanDue = $false
                $reason = "A healthy scan completed $([Math]::Round($ageMinutes, 1)) minutes ago"
              }
              else {
                $reason = "The last healthy scan is $([Math]::Round($ageMinutes, 1)) minutes old"
              }
            }
          }
          "scan_due=$($scanDue.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "Refresh decision: scan_due=$scanDue; $reason" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Run parser, scoring, and privacy tests
        if: github.event_name != 'schedule'
        shell: pwsh
        run: ./tests/run_tests.ps1

      - name: Scan allowed job sources
        if: steps.cadence.outputs.scan_due == 'true'
        id: scan
        continue-on-error: true
        shell: pwsh
        run: ./monitor.ps1 -Mode Scan

      - name: Generate sanitized public site
        if: always() && steps.cadence.outputs.scan_due == 'true'
        shell: pwsh
        run: ./generate_public_site.ps1 -OutputDirectory ./public

      - name: Persist monitor state
        if: always() && steps.cadence.outputs.scan_due == 'true'
        shell: bash
        run: |
          git config user.name "signalpath-job-monitor[bot]"
          git config user.email "signalpath-job-monitor[bot]@users.noreply.github.com"
          git add alerts health reports state
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh hardware job data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        if: always() && steps.cadence.outputs.scan_due == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: always() && steps.cadence.outputs.scan_due == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy public job board
        if: always() && steps.cadence.outputs.scan_due == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preserve failed scan status
        if: steps.scan.outcome == 'failure'
        shell: bash
        run: exit 1
